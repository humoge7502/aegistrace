name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend -e ./sdk pytest pytest-timeout ruff mypy
      - name: Lint (ruff)
        run: ruff check backend sdk --select E9,F63,F7,F82 --ignore E402
      - name: Tests
        run: pytest backend/tests -q
      - name: AttackBench (regression gate)
        run: python benchmarks/attackbench/run_attackbench.py
      - name: Baseline comparison
        run: python benchmarks/baseline_comparison.py
      - name: Performance benchmark
        run: python benchmarks/perf_benchmark.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run build
        env:
          AEGISTRACE_API_URL: http://127.0.0.1:8420
