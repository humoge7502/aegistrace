[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegistrace"
version = "0.1.0"
description = "AegisTrace Python SDK — continuous AI execution attestation (@trace, OpenAI/Anthropic/MCP/RAG integrations)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]

[tool.setuptools.packages.find]
include = ["aegistrace*"]
