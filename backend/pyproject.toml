[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegistrace-backend"
version = "0.1.0"
description = "AegisTrace — continuous AI execution attestation and runtime causal trust (backend service)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42.0",
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-api>=1.25"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
